[project]
name = "ledgerline"
version = "0.2.0"
description = "Invoice-to-decision process for accounts payable."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "python-multipart",
    "pymupdf",
    "pillow",
    "pytesseract",
    "rapidfuzz",
    "google-genai",
    "httpx",
    "pyyaml",
    "reportlab",
    "num2words",
    "python-stdnum",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# A whitespace-split block keeps hand-copied lists (e.g. reason codes) diffable.
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "scenarios: end-to-end checks against the generated demo world",
    "ocr: needs a local Tesseract install",
]
addopts = "-ra"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
