# Demo documents: inbox scenarios S01–S15 and seeded history H01–H24.
# Generator input and test oracle. Money and quantities are plain decimals here; the generator
# formats them in each vendor's print style and computes subtotals, tax, round-off and totals.
#
# Line items either name a PO line (`po_line`, values copied from the document's `po`, any key
# given here overrides) or are written out in full. `po` is the PO the document relates to (for
# lookups only); `po_ref` is the reference text actually printed (null = not printed).

today: 2026-11-20

# Print style per supplier. currency_mark "₹" falls back to "Rs." when no font with the glyph
# is available. po_format placeholders: {po} = full PO number, {n} = its 4-digit serial.
styles:
  V001: {template: classic_gst, date_format: "%d/%m/%Y", amounts: indian, currency_mark: "₹",
         po_label: "PO No.", po_format: "{po}"}
  V002: {template: service_letterhead, date_format: "%d-%m-%Y", amounts: indian,
         currency_mark: "Rs.", po_label: "Your Ref", po_format: "KFPO/{n}", accent: "#1F4E79",
         tagline: "Temperature-controlled warehousing & transport"}
  V003: {template: classic_gst, date_format: "%d.%m.%Y", amounts: indian, currency_mark: "₹",
         po_label: "P.O. No.", po_format: "{po}"}
  V004: {template: small_trader, date_format: "%d/%m/%Y", amounts: indian, currency_mark: "Rs.",
         po_label: "P.O.", po_format: "{n}", total_suffix: "/-",
         tagline: "Dealers in Electrical Goods, Cables & Switchgear"}
  V005: {template: modern, date_format: "%d %b %Y", amounts: western, currency_mark: "INR",
         po_label: "Customer PO", po_format: "{po}", accent: "#0E6E6E"}
  V006: {template: service_letterhead, date_format: "%d-%b-%Y", amounts: indian,
         currency_mark: "₹", po_label: "Work Order Ref", po_format: "{po}", accent: "#2E7D32",
         tagline: "Housekeeping · Deep cleaning · Pest control"}
  V007: {template: modern, date_format: "%d/%m/%Y", amounts: indian, currency_mark: "₹",
         po_label: "Order Ref", po_format: "KF PO {n}", accent: "#3949AB"}
  V008: {template: classic_gst, date_format: "%d-%m-%Y", amounts: indian, currency_mark: "Rs.",
         po_label: "PO#", po_format: "{n}"}
  OMSAI: {template: small_trader, date_format: "%d/%m/%y", amounts: indian, currency_mark: "Rs.",
          po_label: "PO", po_format: "{po}", total_suffix: "/-",
          tagline: "General Order Suppliers - Packing Materials"}
  V009: {template: small_trader, date_format: "%d.%m.%Y", amounts: indian, currency_mark: "Rs.",
         po_label: "PO", po_format: "{po}",
         tagline: "Commission Agents & Traders in Jaggery, Pulses & Grains"}

